name: TripBandhu CI

on:
  push:
    branches: [ main, chore/final-release, feat/* ]
  pull_request:
    branches: [ main ]

env:
  GROQ_API_KEY: "dummy_ci_groq_key"
  TAVILY_API_KEY: "dummy_ci_tavily_key"
  AVIATIONSTACK_API_KEY: "dummy_ci_aviationstack_key"
  OPENWEATHER_API_KEY: "dummy_ci_openweather_key"

jobs:
  fast-checks:
    name: Fast Verification & Unit Evaluations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.8.13
          pip install -r requirements-dev.txt

      - name: Check Syntax & Compilation
        run: |
          python -m compileall . -q

      - name: Check Dependencies
        run: |
          pip check

      - name: Run Fast Pytest Suite (117 unit/contract tests)
        run: |
          python -m pytest -m "not integration" -v --tb=short

      - name: Run Deterministic Fast Evaluator (49 cases)
        run: |
          python -m eval.evaluator

  postgres-integration:
    name: PostgreSQL Checkpoint Persistence & Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: tripbandhu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.8.13
          pip install -r requirements-dev.txt

      - name: Run PostgreSQL Checkpoint Integration Test
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/tripbandhu_test?sslmode=disable
        run: |
          python -m pytest -m "integration" -v --tb=short

      - name: Run Full POSTGRES Benchmark Evaluator (50 cases)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/tripbandhu_test?sslmode=disable
        run: |
          python -m eval.evaluator --postgres

  docker-build:
    name: Dockerfile Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: tripbandhu:ci
